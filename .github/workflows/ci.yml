name: CI

on:
    push:
        branches: [main]
    pull_request:

# Cancel superseded runs on the same ref.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    js:
        name: JS / Vue (lint · format · test)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .tool-versions
                  cache: npm

            - run: npm ci

            # Anti-slop gate: unused imports/vars, undefined refs, etc. are errors.
            - name: ESLint
              run: npm run lint

            - name: Prettier (check only)
              run: npm run format:check

            - name: Unit tests
              run: npm run test:run

    deps:
        name: Unused dependencies (knip)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .tool-versions
                  cache: npm
            - run: npm ci
            - name: Knip (dependencies)
              run: npm run knip -- --dependencies

    rust:
        name: Rust (fmt · clippy · test)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: src-tauri
        steps:
            - uses: actions/checkout@v4

            # Tauri v2 build/link dependencies required to compile the crate on Linux.
            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    libappindicator3-dev \
                    librsvg2-dev \
                    patchelf \
                    libgtk-3-dev \
                    libsoup-3.0-dev \
                    libjavascriptcoregtk-4.1-dev

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: rustfmt (check only)
              run: cargo fmt --check

            # Anti-slop gate: every clippy warning is an error.
            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings

            - name: Tests
              run: cargo test
