[package]
name = "desktop-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["Austin Kregel"]
edition = "2021"
default-run = "desktop-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "php_scan"
path = "src/bin/php_scan.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# Added for cross-language parsing using Tree-sitter. The runtime is bumped to a
# version that supports grammar ABI 15 (tree-sitter-lua 0.5); the older php/js/rust
# grammars (ABI 14) still load fine under the newer runtime.
tree-sitter = "0.25"
tree-sitter-php = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-rust = "0.23"
once_cell = "1"
tree-sitter-lua = "0.5.0"
lancedb = "0.37.1"
fastembed = "6.0.0"
arrow-array = "58"
arrow-schema = "58"
futures = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
